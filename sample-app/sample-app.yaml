AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  deep-health-uptime-canary — OPTIONAL serverless sample app (API Gateway → Lambda →
  DynamoDB on-demand, ≈ $0 at rest) exposing a /health/deep endpoint to try the
  monitoring solution end to end.

Parameters:
  NamePrefix:
    Type: String
    Default: deep-health
    Description: >-
      Prefix for named resources (e.g. the HTTP API). The root stack passes the
      stack name, so everything is named '<stack>-...'.
  TableName:
    Type: String
    Default: ''
    Description: >-
      Optional explicit DynamoDB table name. Leave empty to let CloudFormation
      auto-name it. The root deploy stack passes a clean stack-based name
      (e.g. <root-stack>-health) so the table is easy to find and collision-safe.
  ApiThrottleRateLimit:
    Type: Number
    Default: 20
    MinValue: 1
    Description: >-
      Steady-state request rate (requests/second) allowed on the sample app's HTTP
      API. Keep it well above your combined probe rate — the canary probes at most
      once a minute, and a throttled probe is recorded as a failed run (a false outage).
  ApiThrottleBurstLimit:
    Type: Number
    Default: 40
    MinValue: 1
    Description: >-
      Burst capacity (concurrent requests) allowed on the sample app's HTTP API.
      Should be at least the steady-state rate above.

Conditions:
  HasTableName: !Not [ !Equals [ !Ref TableName, '' ] ]

Resources:

  HealthTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If [ HasTableName, !Ref TableName, !Ref 'AWS::NoValue' ]
      BillingMode: PAY_PER_REQUEST          # on-demand — $0 at rest
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }

  # Seed a sentinel item so /health/deep can do a real GetItem round trip.
  SeedItem:
    Type: Custom::SeedItem
    Properties:
      ServiceToken: !GetAtt SeedFunction.Arn
      TableName: !Ref HealthTable

  SeedFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: seed-put
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: [ dynamodb:PutItem ], Resource: !GetAtt HealthTable.Arn }

  SeedFunction:
    Type: AWS::Lambda::Function
    DependsOn: SeedFunctionLogGroup
    Properties:
      FunctionName: !Sub '${NamePrefix}-seed'
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt SeedFunctionRole.Arn
      Code:
        ZipFile: |
          const { DynamoDBClient, PutItemCommand } = require('@aws-sdk/client-dynamodb');
          const https = require('https');
          // Minimal cfn-response. `Reason` is what CloudFormation surfaces in the stack
          // events on FAILED, so it is set from the error rather than only tucked into Data.
          // content-length must be the BYTE length (Buffer.byteLength), not the character
          // count — a non-ASCII character in the error text would otherwise truncate the
          // body and the pre-signed PUT would be rejected, hanging the stack for an hour.
          const send = (event, ctx, status, reason, data) => new Promise((res) => {
            const body = JSON.stringify({ Status: status, Reason: reason || 'See CloudWatch log ' + ctx.logStreamName,
              PhysicalResourceId: 'seed', StackId: event.StackId,
              RequestId: event.RequestId, LogicalResourceId: event.LogicalResourceId, Data: data || {} });
            const u = new URL(event.ResponseURL);
            const req = https.request({ hostname: u.hostname, path: u.pathname + u.search, method: 'PUT',
              headers: { 'content-type': '', 'content-length': Buffer.byteLength(body) } }, () => res());
            req.on('error', () => res()); req.write(body); req.end();
          });
          exports.handler = async (event, ctx) => {
            try {
              if (event.RequestType !== 'Delete') {
                const ddb = new DynamoDBClient({});
                await ddb.send(new PutItemCommand({ TableName: event.ResourceProperties.TableName,
                  Item: { id: { S: 'health-sentinel' }, ok: { BOOL: true } } }));
              }
              await send(event, ctx, 'SUCCESS', 'OK');
            } catch (e) { await send(event, ctx, 'FAILED', String(e), { error: String(e) }); }
          };

  AppFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: health-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Least-privilege, read-only: the health probe only needs GetItem/DescribeTable.
              - { Effect: Allow, Action: [ dynamodb:GetItem, dynamodb:DescribeTable ], Resource: !GetAtt HealthTable.Arn }

  AppFunction:
    Type: AWS::Lambda::Function
    DependsOn: AppFunctionLogGroup
    Properties:
      FunctionName: !Sub '${NamePrefix}-app'
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt AppFunctionRole.Arn
      Environment:
        Variables:
          HEALTH_TABLE: !Ref HealthTable
          SENTINEL_ID: health-sentinel
          METRIC_NAMESPACE: DeepHealth/Breakdown
      Code:
        ZipFile: |
          // Sample /health/deep — read-only GetItem on a sentinel key (single-digit ms).
          // Mirrors handlers/node/dynamodb with the standard contract.
          //
          // Latency breakdown: this handler emits two CloudWatch metrics via EMF
          // (Embedded Metric Format — just a structured log line, no extra API call,
          // no added request latency):
          //   DbQueryMs   — the dependency (DynamoDB GetItem) round-trip time
          //   TotalMs     — total in-handler time
          // These are DIAGNOSTIC only; the uptime SLO is still judged end-to-end by the
          // canary. They let you see WHY latency is high (cold start vs. slow query).
          // Cold-start time is read from Lambda's own `@initDuration` (REPORT log line)
          // via CloudWatch Logs Insights — see DEPLOYMENT.md. We do NOT synthesize a
          // cold-start metric in-handler (that would include idle wait, not just init).
          const { DynamoDBClient, GetItemCommand } = require('@aws-sdk/client-dynamodb');
          // Bounded client: no retries and an explicit socket timeout, so a slow or
          // unreachable dependency fails FAST as 503 instead of hanging until the Lambda
          // timeout. This is the same isolation rule the reference handlers follow
          // (handlers/README.md) — a health probe must never queue behind a stuck socket.
          const ddb = new DynamoDBClient({
            maxAttempts: 1,
            requestHandler: { connectionTimeout: 500, requestTimeout: 1000 },
          });
          // Emit a metric via EMF. metrics = [{name, value, unit}]; dims picked up from properties.
          // NOTE: this sample emits the breakdown metrics under Service='deep-health-sample'.
          // These metrics are DIAGNOSTIC and are NOT shown on the monitoring dashboard by default;
          // view them in CloudWatch -> Metrics under namespace DeepHealth/Breakdown, or add your own
          // widget. Your own app using the shared handlers/node/emf.js helper defaults the Service
          // dimension to 'deep-health' (override with the METRIC_SERVICE env var). Either way this
          // never affects the uptime verdict, which the canary judges end-to-end.
          function emit(metrics, props) {
            const ns = process.env.METRIC_NAMESPACE || 'DeepHealth/Breakdown';
            const rec = { _aws: { Timestamp: Date.now(), CloudWatchMetrics: [ {
              Namespace: ns, Dimensions: [['Service']],
              Metrics: metrics.map((m) => ({ Name: m.name, Unit: m.unit || 'Milliseconds' })) } ] },
              Service: 'deep-health-sample', ...props };
            for (const m of metrics) rec[m.name] = m.value;
            console.log(JSON.stringify(rec));
          }
          exports.handler = async (event) => {
            const path = event.rawPath || (event.requestContext && event.requestContext.http && event.requestContext.http.path) || '/';
            const t0 = Date.now();
            if (path !== '/health/deep') {
              return { statusCode: 200, headers: { 'content-type': 'application/json', 'cache-control': 'no-store' },
                body: JSON.stringify({ app: 'sample', message: 'ok — try /health/deep' }) };
            }
            try {
              const q0 = Date.now();
              const out = await ddb.send(new GetItemCommand({ TableName: process.env.HEALTH_TABLE,
                Key: { id: { S: process.env.SENTINEL_ID } } }));
              const dbQueryMs = Date.now() - q0;
              if (!out.Item) throw new Error('sentinel item missing');
              const totalMs = Date.now() - t0;
              // Diagnostic breakdown metrics (cold start comes from Lambda @initDuration, not here).
              const metrics = [ { name: 'DbQueryMs', value: dbQueryMs }, { name: 'TotalMs', value: totalMs } ];
              emit(metrics);
              return { statusCode: 200, headers: { 'content-type': 'application/json', 'cache-control': 'no-store' },
                body: JSON.stringify({ status: 'ok', db: 'ok', latencyMs: totalMs, dbQueryMs }) };
            } catch (e) {
              const kind = /timeout/i.test(String(e)) ? 'timeout' : 'error';
              return { statusCode: 503, headers: { 'content-type': 'application/json', 'cache-control': 'no-store' },
                body: JSON.stringify({ status: 'degraded', db: kind, latencyMs: Date.now() - t0 }) };
            }
          };

  # Explicit log groups with retention so the sample never accrues logs forever.
  SeedFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${NamePrefix}-seed'
      RetentionInDays: 14

  AppFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${NamePrefix}-app'
      RetentionInDays: 14

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${NamePrefix}-sample-api'
      ProtocolType: HTTP
      Target: !GetAtt AppFunction.Arn

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # Throttle the API. /health/deep is public and unauthenticated, and every request
  # costs a real DynamoDB call, so an unthrottled endpoint is a cheap amplification
  # target — the same reason the reference handlers rate-limit themselves
  # (handlers/README.md). This is the edge-layer control for the sample app: a
  # REGIONAL WAF Web ACL cannot attach to an HTTP API, only to a REST API.
  #
  # ApiGatewayManagedOverrides is how you configure the '$default' stage that the
  # quick-create API above (Target: ...) creates implicitly — there is no
  # AWS::ApiGatewayV2::Stage resource to attach settings to, and declaring one would
  # mean giving up quick-create. DefaultRouteSettings applies to every route.
  #
  # The limits are generous on purpose: the canary probes at most once a minute, and
  # a 429 to the canary would be recorded as a failed run, i.e. a false outage.
  ApiThrottling:
    Type: AWS::ApiGatewayV2::ApiGatewayManagedOverrides
    Properties:
      ApiId: !Ref HttpApi
      Stage:
        DefaultRouteSettings:
          ThrottlingRateLimit: !Ref ApiThrottleRateLimit
          ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit

Outputs:
  SampleAppUrl:
    Description: Base URL of the sample app. The canary target is this + /health/deep.
    Value: !GetAtt HttpApi.ApiEndpoint
  HealthDeepUrl:
    Description: Pass this as TargetUrl to the monitoring stack.
    Value: !Sub '${HttpApi.ApiEndpoint}/health/deep'
  HealthTableName:
    Value: !Ref HealthTable

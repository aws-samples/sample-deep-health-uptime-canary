AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  deep-health-uptime-canary — one-shot root stack. Deploys the CloudWatch Synthetics
  uptime monitor, optionally with the serverless sample app (DeploySampleApp=yes) or
  against your own endpoint (DeploySampleApp=no + TargetUrl).

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        # W3002 — "may only work with the 'package' cli command". By design: the nested
        # TemplateURLs below are local paths that `aws cloudformation package` (or
        # deploy.sh, which wraps it) rewrites to S3 URLs before deploying.
        - W3002

Parameters:
  DeploySampleApp:
    Type: String
    AllowedValues: [ 'yes', 'no' ]
    Default: 'no'
    Description: >-
      "yes" = also deploy the serverless sample app (~$0 at rest) and monitor it
      automatically. "no" = monitor your own endpoint (provide TargetUrl).
  TargetUrl:
    Type: String
    Default: ''
    Description: >-
      Your /health/deep URL. REQUIRED when DeploySampleApp=no. Ignored when
      DeploySampleApp=yes (the sample app's URL is wired in automatically).
  ScheduleExpression:
    Type: String
    Default: rate(5 minutes)
    AllowedPattern: '^(rate\(.+\)|cron\(.+\))$'
    ConstraintDescription: Must be a rate(...) or cron(...) expression, e.g. rate(5 minutes).
    Description: >-
      Canary schedule, between rate(1 minute) and rate(1 hour). If you change this,
      set AlarmPeriodSeconds to match (see its description) — otherwise the alarms flap.
  SloMs:
    Type: Number
    Default: 3000
    MinValue: 1
    MaxValue: 10000
    Description: >-
      End-to-end latency SLO in milliseconds, INCLUDING any backend cold start. Capped at
      10000 so the assertion always completes inside the canary run timeout.
  AlarmPeriodSeconds:
    Type: Number
    Default: 300
    AllowedValues: [ 60, 300, 900, 3600 ]
    Description: >-
      Alarm evaluation period in seconds. MUST match ScheduleExpression, or most periods
      hold no run and the alarms flap: rate(1 minute)->60, rate(5 minutes)->300,
      rate(15 minutes)->900, rate(1 hour)->3600. deploy.sh sets this for you.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional email subscribed to the alarm SNS topic.
  # VPC mode (optional; only meaningful for your own private endpoint)
  VpcId:
    Type: String
    Default: ''
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ''
  CanarySecurityGroupId:
    Type: String
    Default: ''

Conditions:
  CreateSample: !Equals [ !Ref DeploySampleApp, 'yes' ]

Resources:

  SampleAppStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateSample
    Properties:
      # `aws cloudformation package` rewrites this to the uploaded S3 URL.
      TemplateURL: ../../sample-app/sample-app.yaml
      Parameters:
        # Every resource is prefixed with the stack name the user chose, so a
        # deploy of '--stack-name deep-health' names everything 'deep-health-*'.
        NamePrefix: !Ref AWS::StackName
        # Clean, collision-safe table name derived from the root stack name,
        # e.g. 'deep-health-health' — no auto-generated random suffix.
        TableName: !Sub '${AWS::StackName}-health'

  MonitoringStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./deep-health-uptime.yaml
      Parameters:
        # Drive all monitoring resource names from the stack name the user chose.
        CanaryName: !Ref AWS::StackName
        # Auto-wire: when the sample app is deployed, use its output; otherwise
        # use the user-supplied TargetUrl.
        TargetUrl: !If
          - CreateSample
          - !GetAtt SampleAppStack.Outputs.HealthDeepUrl
          - !Ref TargetUrl
        ScheduleExpression: !Ref ScheduleExpression
        SloMs: !Ref SloMs
        AlarmPeriodSeconds: !Ref AlarmPeriodSeconds
        AlarmEmail: !Ref AlarmEmail
        VpcSubnetIds: !Join [ ',', !Ref VpcSubnetIds ]
        CanarySecurityGroupId: !Ref CanarySecurityGroupId
        VpcId: !Ref VpcId

Outputs:
  MonitoredUrl:
    Description: The /health/deep URL that is being monitored.
    Value: !If [ CreateSample, !GetAtt SampleAppStack.Outputs.HealthDeepUrl, !Ref TargetUrl ]
  SampleAppDeployed:
    Value: !If [ CreateSample, 'yes', 'no' ]
  DashboardName:
    Value: !GetAtt MonitoringStack.Outputs.DashboardName
  AlarmTopicArn:
    Value: !GetAtt MonitoringStack.Outputs.AlarmTopicArn

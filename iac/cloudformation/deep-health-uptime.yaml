AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  deep-health-uptime-canary — End-to-end uptime monitoring stack.
  Provisions a CloudWatch Synthetics canary that probes a /health/deep endpoint,
  plus availability/latency alarms, an SNS topic, a CloudWatch dashboard, an S3
  artifact bucket, a least-privilege IAM role, and a WAF rate-based rule for the
  health path. Supports non-VPC (default, public endpoint) and VPC (private
  endpoint) deployment modes.

Parameters:
  TargetUrl:
    Type: String
    Description: Full public URL the canary probes, e.g. https://app.example.com/health/deep
  CanaryName:
    Type: String
    Default: deep-health
    AllowedPattern: '[0-9a-z_-]{1,21}'
    Description: >-
      Prefix for ALL resource names in this stack (canary, alarms, dashboard, SNS,
      WAF). The root stack passes the stack name here, so '--stack-name deep-health'
      names everything 'deep-health-*'. Must be <=21 chars, lowercase/digits/-/_
      (the 21-char cap is the Synthetics canary-name limit). Override to rename.
  ScheduleExpression:
    Type: String
    Default: rate(5 minutes)
    Description: Canary schedule. Between rate(1 minute) and rate(1 hour).
  SloMs:
    Type: Number
    Default: 3000
    Description: >-
      End-to-end latency SLO in milliseconds. The canary fails a run if the FULL response
      time (as a user experiences it, INCLUDING any backend cold start) exceeds this. Set
      it to the real budget you promise users — do not shrink it to hide cold starts. A
      serverless target that can cold-start needs an honest budget (e.g. 3000ms); a
      warm, steady-traffic service can use a tighter one.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional email address subscribed to the SNS alarm topic. Leave blank to skip.
  # --- VPC mode (leave subnets empty for non-VPC / outside-in mode) ---
  VpcId:
    Type: String
    Default: ''
    Description: >-
      OPTIONAL (VPC mode). The VPC the canary's security group is created in. Required
      when VpcSubnetIds is set UNLESS you supply your own CanarySecurityGroupId. Leave
      blank for non-VPC mode.
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      OPTIONAL. Private subnet IDs for VPC mode (private endpoints). Leave blank
      for non-VPC mode (recommended for public endpoints). Requires a NAT Gateway
      or S3/CloudWatch VPC endpoints for canary egress.
  CanarySecurityGroupId:
    Type: String
    Default: ''
    Description: >-
      OPTIONAL override. Existing security group ID for the canary in VPC mode. Leave
      blank and the stack creates one (egress 443 only) in VpcId. Provide an sg-... ID
      to use your own instead.

Conditions:
  HasEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  IsVpcMode: !Not [!Equals [!Join ['', !Ref VpcSubnetIds], '']]
  # Create an SG only in VPC mode AND when the user did not supply their own.
  HasOwnSg: !Not [!Equals [!Ref CanarySecurityGroupId, '']]
  CreateCanarySg: !And [ !Condition IsVpcMode, !Not [ !Condition HasOwnSg ] ]

Resources:

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-canary-artifacts
            Status: Enabled
            ExpirationInDays: 31

  # Canary security group (VPC mode only, created unless the user supplied one).
  # Egress 443 so the canary can reach CloudWatch/S3 (via NAT or VPC endpoints) and
  # the target HTTPS endpoint. No inbound is needed.
  CanarySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateCanarySg
    Properties:
      GroupDescription: !Sub '${CanaryName} canary egress (443)'
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS egress to CloudWatch/S3 and the target endpoint
      Tags:
        - { Key: Name, Value: !Sub '${CanaryName}-canary-sg' }

  CanaryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: canary-min
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ s3:PutObject, s3:GetBucketLocation ]
                Resource:
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}'
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}/*'
              - Effect: Allow
                Action: [ cloudwatch:PutMetricData ]
                Resource: '*'
                Condition:
                  StringEquals: { 'cloudwatch:namespace': CloudWatchSynthetics }
              - Effect: Allow
                Action: [ logs:CreateLogStream, logs:PutLogEvents, logs:CreateLogGroup ]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-*'
              - !If
                - IsVpcMode
                - Effect: Allow
                  Action:
                    - ec2:CreateNetworkInterface
                    - ec2:DescribeNetworkInterfaces
                    - ec2:DeleteNetworkInterface
                  Resource: '*'
                - !Ref AWS::NoValue

  DeepHealthCanary:
    Type: AWS::Synthetics::Canary
    Properties:
      Name: !Ref CanaryName
      ArtifactS3Location: !Sub 's3://${ArtifactBucket}/canary'
      ExecutionRoleArn: !GetAtt CanaryRole.Arn
      RuntimeVersion: syn-nodejs-puppeteer-17.0
      StartCanaryAfterCreation: true
      Schedule:
        Expression: !Ref ScheduleExpression
        DurationInSeconds: '0'
      RunConfig:
        TimeoutInSeconds: 30
        EnvironmentVariables:
          TARGET_URL: !Ref TargetUrl
          SLO_MS: !Ref SloMs
      Code:
        Handler: deep-health.handler
        Script: |
          const synthetics = require('@aws/synthetics-puppeteer');
          const log = require('@aws/synthetics-logger');
          const https = require('https');

          const deepHealthCheck = async function () {
            const url = process.env.TARGET_URL;
            const sloMs = parseInt(process.env.SLO_MS || '3000', 10);
            const start = Date.now();

            const body = await new Promise((resolve, reject) => {
              const req = https.get(url, { headers: { 'X-Synthetic': 'true' } }, (res) => {
                let data = '';
                res.on('data', (c) => { data += c; });
                res.on('end', () => {
                  if (res.statusCode !== 200) { reject(new Error(`HTTP ${res.statusCode}`)); return; }
                  resolve(data);
                });
              });
              req.on('error', reject);
              req.setTimeout(10000, () => { req.destroy(new Error('request timeout')); });
            });

            const latency = Date.now() - start;
            log.info(`round-trip ${latency}ms (SLO ${sloMs}ms)`);
            if (latency > sloMs) throw new Error(`Latency ${latency}ms exceeds SLO ${sloMs}ms`);
            try {
              const parsed = JSON.parse(body);
              if (parsed.status !== 'ok') throw new Error(`degraded: ${JSON.stringify(parsed)}`);
            } catch (e) { throw new Error(`invalid health payload: ${e.message}`); }
          };

          exports.handler = async () => { return await deepHealthCheck(); };
      VPCConfig: !If
        - IsVpcMode
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds:
            - !If [ CreateCanarySg, !GetAtt CanarySecurityGroup.GroupId, !Ref CanarySecurityGroupId ]
        - !Ref AWS::NoValue

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub '${CanaryName}-uptime-alarms'

  AlarmEmailSub:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  AvailabilityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${CanaryName}-availability'
      AlarmDescription: Canary success percent dropped below 100% (a run failed).
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - { Name: CanaryName, Value: !Ref CanaryName }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [ !Ref AlarmTopic ]
      OKActions: [ !Ref AlarmTopic ]

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${CanaryName}-latency'
      AlarmDescription: >-
        End-to-end response time (canary run Duration, which includes any backend cold
        start — the real time a user waits) stayed above the SLO for 3 consecutive runs.
      Namespace: CloudWatchSynthetics
      MetricName: Duration
      Dimensions:
        - { Name: CanaryName, Value: !Ref CanaryName }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref SloMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlarmTopic ]

  HealthRateLimitWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${CanaryName}-health-ratelimit'
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${CanaryName}healthAcl'
      Rules:
        - Name: rate-limit-health
          Priority: 0
          Action: { Block: {} }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${CanaryName}rlHealth'
          Statement:
            RateBasedStatement:
              Limit: 100
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch: { UriPath: {} }
                  PositionalConstraint: STARTS_WITH
                  SearchString: /health/deep
                  TextTransformations:
                    - { Priority: 0, Type: NONE }

  UptimeDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${CanaryName}-uptime'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Availability % (SuccessPercent)",
                "metrics": [[ "CloudWatchSynthetics", "SuccessPercent", "CanaryName", "${CanaryName}" ]],
                "view": "timeSeries", "stat": "Average", "period": 300, "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0, "max": 100 } }
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "End-to-end latency (Duration ms)",
                "metrics": [[ "CloudWatchSynthetics", "Duration", "CanaryName", "${CanaryName}" ]],
                "view": "timeSeries", "stat": "Average", "period": 300, "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Cumulative uptime %",
                "metrics": [
                  [ "CloudWatchSynthetics", "2xx", "CanaryName", "${CanaryName}", { "id": "p", "visible": false, "stat": "Sum" } ],
                  [ "CloudWatchSynthetics", "Failed", "CanaryName", "${CanaryName}", { "id": "f", "visible": false, "stat": "Sum" } ],
                  [ { "expression": "100*p/(p+f)", "label": "Uptime %", "id": "u" } ]
                ],
                "view": "singleValue", "setPeriodToTimeRange": true, "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Passed (2xx) vs Failed runs",
                "metrics": [
                  [ "CloudWatchSynthetics", "2xx", "CanaryName", "${CanaryName}", { "stat": "Sum", "label": "Passed (2xx)" } ],
                  [ "CloudWatchSynthetics", "Failed", "CanaryName", "${CanaryName}", { "stat": "Sum", "label": "Failed" } ]
                ],
                "view": "timeSeries", "period": 300, "region": "${AWS::Region}"
              }
            },
            {
              "type": "text", "x": 0, "y": 12, "width": 24, "height": 3,
              "properties": {
                "markdown": "**Latency breakdown (diagnostic)** — from the target app's EMF metrics (`DeepHealth/Breakdown`): WHY latency is high, cold start vs. dependency query. The uptime SLO is still judged end-to-end (above). `ColdStartMs` is **Lambda-only** and stays empty on EC2/ECS/Fargate (long-lived processes, no per-request cold start) — there, read `TotalMs` (app total) and `DbQueryMs` (dependency query)."
              }
            },
            {
              "type": "metric", "x": 0, "y": 13, "width": 12, "height": 6,
              "properties": {
                "title": "Latency breakdown over time (ms)",
                "metrics": [
                  [ "DeepHealth/Breakdown", "TotalMs", "Service", "deep-health-sample", { "stat": "Average", "label": "Total (in-handler) ms" } ],
                  [ "DeepHealth/Breakdown", "DbQueryMs", "Service", "deep-health-sample", { "stat": "Average", "label": "DB query ms" } ],
                  [ "DeepHealth/Breakdown", "ColdStartMs", "Service", "deep-health-sample", { "stat": "Average", "label": "Cold start ms (cold invokes only)" } ]
                ],
                "view": "timeSeries", "period": 300, "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric", "x": 12, "y": 13, "width": 6, "height": 6,
              "properties": {
                "title": "Cold start (ms, latest)",
                "metrics": [
                  [ "DeepHealth/Breakdown", "ColdStartMs", "Service", "deep-health-sample", { "stat": "Maximum" } ]
                ],
                "view": "singleValue", "period": 300, "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric", "x": 18, "y": 13, "width": 6, "height": 6,
              "properties": {
                "title": "DB query (ms, avg)",
                "metrics": [
                  [ "DeepHealth/Breakdown", "DbQueryMs", "Service", "deep-health-sample", { "stat": "Average" } ]
                ],
                "view": "singleValue", "period": 300, "region": "${AWS::Region}"
              }
            }
          ]
        }

Outputs:
  CanaryNameOut:
    Description: The deployed canary name.
    Value: !Ref CanaryName
  DeploymentMode:
    Description: Whether the canary deployed in VPC or non-VPC mode.
    Value: !If [IsVpcMode, 'VPC mode (private endpoint)', 'non-VPC (public, outside-in)']
  DashboardName:
    Value: !Ref UptimeDashboard
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  WebACLArn:
    Description: Associate this Web ACL with your ALB/CloudFront to rate-limit /health/deep.
    Value: !GetAtt HealthRateLimitWebACL.Arn

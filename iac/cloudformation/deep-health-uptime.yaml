AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  deep-health-uptime-canary — Measures end-to-end uptime by probing a deep-health
  endpoint with a CloudWatch Synthetics canary, and reports it as an SLA percentage
  with alarms.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Target and schedule }
        Parameters: [ TargetUrl, CanaryName, ScheduleExpression, SloMs ]
      - Label: { default: Alarms }
        Parameters: [ AlarmEmail, AlarmPeriodSeconds ]
      - Label: { default: VPC mode (private endpoints only - leave blank for public) }
        Parameters: [ VpcId, VpcSubnetIds, CanarySecurityGroupId ]
    ParameterLabels:
      TargetUrl: { default: Deep-health endpoint URL to probe }
      CanaryName: { default: Resource name prefix (<=21 chars) }
      ScheduleExpression: { default: Probe schedule }
      SloMs: { default: End-to-end latency SLO (ms) }
      AlarmEmail: { default: Alarm notification email (optional) }
      AlarmPeriodSeconds: { default: Alarm period (match your probe interval) }
      VpcId: { default: VPC ID (VPC mode) }
      VpcSubnetIds: { default: Private subnet IDs (VPC mode) }
      CanarySecurityGroupId: { default: Existing security group ID (optional) }

Parameters:
  TargetUrl:
    Type: String
    AllowedPattern: '^https?://.+'
    ConstraintDescription: Must be a full http(s) URL, e.g. https://app.example.com/health/deep
    Description: Full public URL the canary probes, e.g. https://app.example.com/health/deep
  CanaryName:
    Type: String
    Default: deep-health
    AllowedPattern: '[0-9a-z_-]{1,21}'
    Description: >-
      Prefix for ALL resource names in this stack (canary, alarms, dashboard, SNS).
      The root stack passes the stack name here, so '--stack-name deep-health'
      names everything 'deep-health-*'. Must be <=21 chars, lowercase/digits/-/_
      (the 21-char cap is the Synthetics canary-name limit). Override to rename.
  ScheduleExpression:
    Type: String
    Default: rate(5 minutes)
    AllowedPattern: '^(rate\(.+\)|cron\(.+\))$'
    ConstraintDescription: Must be a rate(...) or cron(...) expression, e.g. rate(5 minutes).
    Description: Canary schedule. Between rate(1 minute) and rate(1 hour).
  SloMs:
    Type: Number
    Default: 3000
    MinValue: 1
    MaxValue: 10000
    Description: >-
      End-to-end latency SLO in milliseconds. The canary fails a run if the FULL response
      time (as a user experiences it, INCLUDING any backend cold start) exceeds this. Set
      it to the real budget you promise users — do not shrink it to hide cold starts. A
      serverless target that can cold-start needs an honest budget (e.g. 3000ms); a
      warm, steady-traffic service can use a tighter one. Capped at 10000ms so the assertion
      always evaluates within the canary run timeout (which also covers runtime boot).
  AlarmPeriodSeconds:
    Type: Number
    Default: 300
    AllowedValues: [ 60, 300, 900, 3600 ]
    Description: >-
      CloudWatch alarm evaluation period in seconds. MUST be >= your probe interval, or
      most periods hold no run and the alarms flap. Rule of thumb:
      rate(1 minute)->60, rate(5 minutes)->300, rate(15 minutes)->900, rate(1 hour)->3600.
      deploy.sh and the root stack (deploy.yaml) derive this from ScheduleExpression
      automatically — set it by hand only when deploying this template directly.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional email address subscribed to the SNS alarm topic. Leave blank to skip.
  # --- VPC mode (leave subnets empty for non-VPC / outside-in mode) ---
  VpcId:
    Type: String
    Default: ''
    Description: >-
      OPTIONAL (VPC mode). The VPC the canary's security group is created in. Required
      when VpcSubnetIds is set UNLESS you supply your own CanarySecurityGroupId. Leave
      blank for non-VPC mode.
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      OPTIONAL. Private subnet IDs for VPC mode (private endpoints). Leave blank
      for non-VPC mode (recommended for public endpoints). Requires a NAT Gateway
      or S3/CloudWatch VPC endpoints for canary egress.
  CanarySecurityGroupId:
    Type: String
    Default: ''
    Description: >-
      OPTIONAL override. Existing security group ID for the canary in VPC mode. Leave
      blank and the stack creates one (egress 443 only) in VpcId. Provide an sg-... ID
      to use your own instead.

Conditions:
  HasEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  IsVpcMode: !Not [!Equals [!Join ['', !Ref VpcSubnetIds], '']]
  # Create an SG only in VPC mode AND when the user did not supply their own.
  HasOwnSg: !Not [!Equals [!Ref CanarySecurityGroupId, '']]
  CreateCanarySg: !And [ !Condition IsVpcMode, !Not [ !Condition HasOwnSg ] ]

Resources:

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-canary-artifacts
            Status: Enabled
            ExpirationInDays: 31

  # Canary security group (VPC mode only, created unless the user supplied one).
  # Egress 443 so the canary can reach CloudWatch/S3 (via NAT or VPC endpoints) and
  # the target HTTPS endpoint. No inbound is needed.
  CanarySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateCanarySg
    Properties:
      GroupDescription: !Sub '${CanaryName} canary egress (443)'
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS egress to CloudWatch/S3 and the target endpoint
      Tags:
        - { Key: Name, Value: !Sub '${CanaryName}-canary-sg' }

  CanaryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: canary-min
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ s3:PutObject, s3:GetBucketLocation ]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/*'
              # The Synthetics runtime lists buckets to locate the artifact bucket; this action
              # only supports "*" (it cannot be resource-scoped). It exposes only bucket NAMES,
              # not contents. Matches AWS's documented canary execution policy.
              - Effect: Allow
                Action: [ s3:ListAllMyBuckets ]
                Resource: '*'
              - Effect: Allow
                Action: [ cloudwatch:PutMetricData ]
                Resource: '*'
                Condition:
                  StringEquals: { 'cloudwatch:namespace': CloudWatchSynthetics }
              - Effect: Allow
                Action: [ logs:CreateLogStream, logs:PutLogEvents, logs:CreateLogGroup ]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-*'
              - !If
                - IsVpcMode
                - Effect: Allow
                  Action:
                    - ec2:CreateNetworkInterface
                    - ec2:DescribeNetworkInterfaces
                    - ec2:DeleteNetworkInterface
                  Resource: '*'
                - !Ref AWS::NoValue

  DeepHealthCanary:
    Type: AWS::Synthetics::Canary
    Properties:
      Name: !Ref CanaryName
      ArtifactS3Location: !Sub 's3://${ArtifactBucket}/canary'
      ExecutionRoleArn: !GetAtt CanaryRole.Arn
      RuntimeVersion: syn-nodejs-puppeteer-17.0
      StartCanaryAfterCreation: true
      Schedule:
        Expression: !Ref ScheduleExpression
        DurationInSeconds: '0'
      RunConfig:
        # 45s covers canary runtime boot (~15s) plus the asserted HTTP round-trip (SloMs is
        # capped at 10000ms for exactly this reason), so a run is never killed by the hard
        # timeout before the latency check evaluates. Deliberately BELOW 60s: Synthetics
        # rejects a timeout longer than the run frequency, and rate(1 minute) is supported.
        TimeoutInSeconds: 45
        EnvironmentVariables:
          TARGET_URL: !Ref TargetUrl
          SLO_MS: !Ref SloMs
      Code:
        Handler: deep-health.handler
        Script: |
          const synthetics = require('@aws/synthetics-puppeteer');
          const log = require('@aws/synthetics-logger');

          // Uses the INSTRUMENTED HTTP step so the library emits the request-level
          // 2xx/4xx/5xx metrics + per-step Duration, and writes a step report per run.
          // A raw https.get creates no step, so there is no per-step Duration (the
          // metric the latency alarm uses) and no step report. Availability on the
          // dashboard is computed from SuccessPercent (run-level), not from the
          // per-request 2xx count. Two S3 objects per run: HttpRequestsReport.json
          // and SyntheticsReport-<STATUS>.json. No .har, no screenshots (an HTTP step
          // never opens a page); canary logs go to CloudWatch Logs, not S3.
          //
          // MIRRORS canary/deep-health.js, which is the source of truth and carries the
          // full commentary. `python3 test/repo_checks.py` fails if the two drift.
          const deepHealthCheck = async function () {
            const url = process.env.TARGET_URL;
            const sloMs = parseInt(process.env.SLO_MS || '3000', 10);
            if (!url) throw new Error('TARGET_URL environment variable is required');

            const u = new URL(url);
            const requestOptions = {
              hostname: u.hostname,
              method: 'GET',
              path: `${u.pathname}${u.search}`,
              port: u.port || (u.protocol === 'https:' ? 443 : 80),
              protocol: u.protocol,
              headers: { 'X-Synthetic': 'true' },
            };
            // Header/body capture MUST be set on the GLOBAL configuration — passing
            // these in executeHttpStep's stepConfig is silently ignored (a live run
            // recorded "headers": "Not enabled" and an empty body). restrictedHeaders
            // redacts credentials so they never land in the S3 artifact.
            synthetics.getConfiguration().setConfig({
              includeRequestHeaders: true,
              includeResponseHeaders: true,
              includeRequestBody: false,
              includeResponseBody: true,
              restrictedHeaders: ['authorization', 'cookie', 'set-cookie', 'x-api-key', 'x-amz-security-token'],
            });

            const stepConfig = {
              continueOnHttpStepFailure: false,
            };

            let capturedBody = '';
            const start = Date.now();
            const validate = async function (res) {
              return await new Promise((resolve, reject) => {
                let data = '';
                res.on('data', (chunk) => { data += chunk; });
                res.on('end', () => {
                  capturedBody = data;
                  if (res.statusCode < 200 || res.statusCode > 299) {
                    reject(new Error(`Unhealthy: HTTP ${res.statusCode}`));
                    return;
                  }
                  resolve();
                });
                res.on('error', reject);
              });
            };

            await synthetics.executeHttpStep('deep-health', requestOptions, validate, stepConfig);

            const latency = Date.now() - start;
            log.info(`Deep health round-trip: ${latency}ms (SLO ${sloMs}ms)`);
            if (latency > sloMs) {
              throw new Error(`Latency ${latency}ms exceeds SLO ${sloMs}ms`);
            }

            let parsed;
            try {
              parsed = JSON.parse(capturedBody);
            } catch (e) {
              throw new Error(`Invalid health payload (not JSON): ${e.message}`);
            }
            if (parsed.status !== 'ok') {
              throw new Error(`Endpoint reported degraded: ${JSON.stringify(parsed)}`);
            }

            log.info('Deep health check passed.');
          };

          exports.handler = async () => {
            return await deepHealthCheck();
          };
      VPCConfig: !If
        - IsVpcMode
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds:
            - !If [ CreateCanarySg, !GetAtt CanarySecurityGroup.GroupId, !Ref CanarySecurityGroupId ]
        - !Ref AWS::NoValue

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub '${CanaryName}-uptime-alarms'

  AlarmEmailSub:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  AvailabilityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${CanaryName}-availability'
      AlarmDescription: Canary success percent dropped below 100% (a run failed).
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - { Name: CanaryName, Value: !Ref CanaryName }
      Statistic: Average
      Period: !Ref AlarmPeriodSeconds
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: LessThanThreshold
      # A single failed run IS an outage, so no debounce here — page on the first bad
      # datapoint. 'missing' (not 'breaching') so a period that legitimately has no run
      # datapoint (scheduling jitter, a paused canary) does not create a false ALARM.
      TreatMissingData: missing
      AlarmActions: [ !Ref AlarmTopic ]
      OKActions: [ !Ref AlarmTopic ]

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${CanaryName}-latency'
      AlarmDescription: >-
        HTTP round-trip time of the deep-health step (the real end-to-end time a user waits,
        including any backend cold start) exceeded the SLO in 2 of the last 3 runs. Uses the
        per-step Duration (StepName=deep-health), NOT the whole-canary run Duration, so canary
        runtime boot time does not trip the alarm.
      Namespace: CloudWatchSynthetics
      MetricName: Duration
      Dimensions:
        - { Name: CanaryName, Value: !Ref CanaryName }
        - { Name: StepName, Value: deep-health }
      Statistic: Average
      Period: !Ref AlarmPeriodSeconds
      # Debounced: 2 bad datapoints out of the last 3. Because AlarmPeriodSeconds tracks the
      # probe interval, each period holds one run — so this means "2 of the last 3 runs were
      # slow". A single cold start or network blip does not page anyone, and unlike 3-of-3 it
      # still fires when scheduling jitter leaves one period without a datapoint.
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref SloMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlarmTopic ]

  UptimeDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${CanaryName}-uptime'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Availability % (SuccessPercent)",
                "metrics": [[ "CloudWatchSynthetics", "SuccessPercent", "CanaryName", "${CanaryName}" ]],
                "view": "timeSeries", "stat": "Average", "period": ${AlarmPeriodSeconds}, "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0, "max": 100 } }
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "End-to-end latency \u2014 HTTP round-trip (ms)",
                "metrics": [[ "CloudWatchSynthetics", "Duration", "CanaryName", "${CanaryName}", "StepName", "deep-health" ]],
                "view": "timeSeries", "stat": "Average", "period": ${AlarmPeriodSeconds}, "region": "${AWS::Region}",
                "annotations": { "horizontal": [
                  { "label": "SLO (${SloMs} ms)", "value": ${SloMs}, "color": "#d62728" }
                ] }
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Cumulative uptime %",
                "metrics": [
                  [ "CloudWatchSynthetics", "SuccessPercent", "CanaryName", "${CanaryName}", { "label": "Uptime %", "stat": "Average" } ]
                ],
                "view": "singleValue", "setPeriodToTimeRange": true, "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Total vs Failed runs (over range)",
                "metrics": [
                  [ "CloudWatchSynthetics", "SuccessPercent", "CanaryName", "${CanaryName}", { "stat": "SampleCount", "label": "Total runs" } ],
                  [ "CloudWatchSynthetics", "Failed", "CanaryName", "${CanaryName}", { "stat": "Sum", "label": "Failed runs" } ]
                ],
                "view": "singleValue", "setPeriodToTimeRange": true, "region": "${AWS::Region}"
              }
            }
          ]
        }

Outputs:
  CanaryNameOut:
    Description: The deployed canary name.
    Value: !Ref CanaryName
  DeploymentMode:
    Description: Whether the canary deployed in VPC or non-VPC mode.
    Value: !If [IsVpcMode, 'VPC mode (private endpoint)', 'non-VPC (public, outside-in)']
  DashboardName:
    Value: !Ref UptimeDashboard
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
